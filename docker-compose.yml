version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: mini_sentinel_postgres
    environment:
      POSTGRES_USER: sentinel_user
      POSTGRES_PASSWORD: sentinel_password
      POSTGRES_DB: sentinel_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel_user -d sentinel_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mini_sentinel_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  pii-service:
    build:
      context: ./pii-service
      dockerfile: Dockerfile
    container_name: mini_sentinel_pii_service
    ports:
      - "50051:50051"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

